[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nsfw-guard"
version = "0.1.0a4"
description = "Fast, local-first image safety decisions with an integration-safe bridge."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "Angus Velsmann" }]
keywords = ["content-safety", "image-classification", "nsfw", "onnx", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10.3,<13",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.18,<2"]
cuda = ["onnxruntime-gpu>=1.18,<2"]
cuda-bundled = ["onnxruntime-gpu[cuda,cudnn]>=1.18,<2"]
directml = ["onnxruntime-directml>=1.18,<2; platform_system == 'Windows'"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "twine>=6,<7",
  "types-Pillow>=10.2",
  "types-psutil>=5.9",
]

[project.scripts]
nsfw-guard = "nsfw_guard.entrypoint:main"

[project.urls]
Homepage = "https://github.com/IamAngusU/nsfw-guard"
Issues = "https://github.com/IamAngusU/nsfw-guard/issues"
Documentation = "https://github.com/IamAngusU/nsfw-guard#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/nsfw_guard/folder_scan.py" = ["E501"]
"src/nsfw_guard/metrics_chart.py" = ["E501"]
"src/nsfw_guard/run_chart.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nsfw_guard"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["nsfw_guard"]

[tool.coverage.report]
show_missing = true
skip_covered = true
